const parentKey=$('#parent');function startHold(){if(held||dialog.open)return;held=true;openedByHold=false;parentKey.classList.add('holding');clearTimeout(hintTimer);$('#hint').textContent='꾹 누르면 보호자 설정이 열려요.';holdTimer=setTimeout(()=>{if(!held)return;openedByHold=true;held=false;parentKey.classList.remove('holding');$('#hint').textContent='';guardian()},1200)}function endHold(){held=false;clearTimeout(holdTimer);parentKey.classList.remove('holding');$('#hint').textContent=''}
parentKey.addEventListener('pointerdown',e=>{if(e.button!==0)return;parentKey.setPointerCapture(e.pointerId);startHold()});for(const t of ['pointerup','pointercancel','lostpointercapture','blur'])parentKey.addEventListener(t,endHold);parentKey.addEventListener('pointermove',e=>{if(!held)return;const r=parentKey.getBoundingClientRect();if(e.clientX<r.left-8||e.clientX>r.right+8||e.clientY<r.top-8||e.clientY>r.bottom+8)endHold()});parentKey.addEventListener('contextmenu',e=>e.preventDefault());parentKey.addEventListener('keydown',e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();if(!e.repeat)startHold()}});parentKey.addEventListener('keyup',e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();endHold()}});parentKey.onclick=()=>{if(openedByHold||dialog.open)return;$('#hint').textContent='보호자 버튼을 1.2초간 꾹 눌러 주세요.';clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('#hint').textContent='',2200)};
document.addEventListener('keydown',e=>{if(e.repeat||e.isComposing||e.ctrlKey||e.altKey||e.metaKey||dialog.open||active==='draw'||e.target.closest('input,textarea,select,[contenteditable=true]'))return;const k=e.key.toLowerCase();if(active==='music'&&musicKeys.includes(k)&&k.length===1){e.preventDefault();current.s.play(musicKeys.indexOf(k));return}const id=({a:'abc','1':'num',b:'animal',c:'color',m:'music',d:'draw',s:'shape',t:'star',w:'dress',g:'gift',h:'home',escape:'home'})[k];if(id){e.preventDefault();navigate(id)}});
function quiet(){endHold();SpeechManager.cancel();AudioEngine.stop();if(active==='music')current.s.stop();const b=screenEl.querySelector('.bunny');if(b)b.dataset.state='SLEEPING'}document.addEventListener('visibilitychange',()=>{if(document.hidden)quiet();else mood('IDLE')});window.addEventListener('pagehide',quiet);
keyboard();applyPrefs();navigate('home',false);
